    <style>
        :root {
            --bg-dark: #0d1117; --accent-blue: #00a8ff; --text-white: #ffffff;
            --text-gray: #8b949e; --card-bg: rgba(22, 27, 34, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --nav-closed-width: 70px; --nav-open-width: 200px;
        }

        /* ★カーソルを水色の円に変更（画像として定義） */
        * { 
            box-sizing: border-box; 
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="%2300a8ff" stroke="white" stroke-width="1.5"/></svg>') 8 8, auto !important; 
        }

        body { background-color: var(--bg-dark); color: var(--text-white); font-family: 'Inter', 'Noto Sans JP', sans-serif; margin: 0; overflow-x: hidden; line-height: 1.6; }
        
        /* キャンバス：背景用とエフェクト用 */
        #bg-canvas { position: fixed; top: 0; left: 0; z-index: -1; }

        /* サイドナビゲーション */
        .side-nav {
            position: fixed; top: 0; left: 0; width: var(--nav-closed-width); height: 100vh;
            background: rgba(13, 17, 23, 0.9); border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; padding: 20px 0; z-index: 100;
            backdrop-filter: blur(15px); transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1); overflow: hidden; white-space: nowrap;
        }
        .side-nav:hover { width: var(--nav-open-width); background: rgba(13, 17, 23, 0.98); box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5); }
        .nav-item { width: 100%; height: 50px; display: flex; align-items: center; padding: 0 22px; color: var(--text-gray); text-decoration: none; transition: 0.3s; pointer-events: auto; }
        .nav-item i { font-size: 1.2rem; min-width: 26px; text-align: center; }
        .nav-text { margin-left: 20px; font-weight: 700; font-size: 0.95rem; opacity: 0; transform: translateX(-10px); transition: 0.3s; }
        .side-nav:hover .nav-text { opacity: 1; transform: translateX(0); }
        .nav-item:hover { color: var(--accent-blue); background: rgba(255, 255, 255, 0.05); }

        /* コンテンツ */
        .container { max-width: 900px; margin: 0 auto 0 var(--nav-closed-width); padding: 80px 40px; position: relative; z-index: 10; }
        .section-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 24px; padding: 40px; margin-bottom: 60px; backdrop-filter: blur(8px); }
        
      .nameplate-null-user {
        position: relative;
        flex: 1;

      .nameplate-null-user-name {

      .nameplate-deco {

      .nameplate-user-name {
        position: absolute;

        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        z-index: 22;

      }
      /* Discord Nametag Font Classes */
      /* Tempo  → Zilla Slab */
      .dns-font-tempo { font-family: 'Zilla Slab', serif !important; font-size: 0.9rem !important; }
      /* Sakura → Cherry Bomb One */
      .dns-font-sakura { font-family: 'Cherry Bomb One', cursive !important; font-size: 0.9rem !important; }
      /* Jellybean → Chicle */
      .dns-font-jellybean { font-family: 'Chicle', cursive !important; font-size: 0.9rem !important; }
      /* Modern → Museo Moderno */
      .dns-font-modern { font-family: 'MuseoModerno', sans-serif !important; font-size: 0.9rem !important; }
      /* Medieval → New Amsterdam (closest available; Neo Castel not on Google Fonts) */
      .dns-font-medieval { font-family: 'New Amsterdam', sans-serif !important; font-size: 0.9rem !important; }
      /* 8Bit / Pixelfy Sans */
      .dns-font-8bit { font-family: 'Pixelify Sans', monospace !important; font-size: 0.9rem !important; }
      /* Vampyre → Cinzel (closest available; Sinistre not on Google Fonts) */
      .dns-font-vampyre { font-family: 'Cinzel', serif !important; font-size: 0.9rem !important; }

      /* Gradient name effect (mirrors Discord's gradient_dfb989) */
      .nameplate-user-name.dns-gradient {
        background: linear-gradient(
          90deg,
          var(--dns-color-start, #903cda),
          var(--dns-color-end, #1fb373)
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        color: transparent !important;
      }

      /* Neon effect (mirrors Discord's neon_dfb989 + neonGlow_dfb989) */
      .nameplate-user-name.dns-neon {
        position: relative;
        color: var(--dns-neon-color, #7d33ff) !important;
        -webkit-text-stroke: 0.5px var(--dns-neon-stroke, #7d33ff);
        text-shadow:
          0 0 6px var(--dns-neon-stroke, #7d33ff),
          0 0 14px var(--dns-neon-stroke, #7d33ff);
        overflow: visible;
      }
      .nameplate-user-name.dns-neon::after {
        content: attr(data-name);
        position: absolute;
        left: 0;
        top: 0;
        color: var(--dns-neon-stroke, #7d33ff);
        filter: blur(7px);
        opacity: 0.65;
        pointer-events: none;
        white-space: nowrap;
      }

      .nameplate-role-label {
        position: absolute;
        top: 26px;
        left: 60px;
        font-size: 0.65rem;
        color: rgba(255, 255, 255, 0.5);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: calc(100% - 68px);
        z-index: 22;
      }
      @media (max-width: 900px) {
        .team-row {
          flex-wrap: wrap;
        }
        .nameplate-null-user {
          flex: 1 1 calc(50% - 5px);
        }
      }
      @media (max-width: 500px) {
        .nameplate-null-user {
          flex: 1 1 100%;
        }
      }

      .font-sakura {
    font-family: 'Cherry Bomb One', cursive;
}

        /* 入力フォーム */
        .form-input { width: 100%; background: #000; border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; color: #fff; margin-bottom: 15px; pointer-events: auto; }
        .submit-btn { background: transparent; border: 1px solid var(--accent-blue); color: var(--accent-blue); padding: 15px; border-radius: 8px; font-weight: bold; width: 100%; transition: 0.3s; pointer-events: auto; }
        .submit-btn:hover { background: var(--accent-blue); color: #fff; }

        @media (max-width: 768px) {
            .side-nav { width: 100%; height: 60px; top: auto; bottom: 0; flex-direction: row; }
            .container { margin: 0 auto; padding-bottom: 100px; }
        }

<script>
    // --- 1. Supabase設定 ---
    const SB_URL = 'https://sphxblzkqxmkrtfiwjnq.supabase.co'; 
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNwaHhibHprcXhta3J0Zml3am5xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4OTE5MjcsImV4cCI6MjA5MzQ2NzkyN30.E6mVpH-eeg5ML7J9fJI0FLqBTiykpo8zEc6DLcHhhig';
    const sb = supabase.createClient(SB_URL, SB_KEY);

    async function login() {
        await sb.auth.signInWithOAuth({
            provider: 'discord',
            options: { redirectTo: window.location.origin + window.location.pathname }
        });
    }

    window.addEventListener('load', async () => {
        const { data: { session } } = await sb.auth.getSession();
        if (session) {
            document.getElementById('login-view').style.display = 'none';
            document.getElementById('contact-view').style.display = 'block';
            document.getElementById('user-name').innerText = "Logged in as: " + session.user.user_metadata.full_name;
        }
    });

    // ★修正した送信機能（直接Discordに送ります）
    async function send() {
        const msg = document.getElementById('msg-input').value;
        const { data: { session } } = await sb.auth.getSession();
        
        if (!msg) return alert("Message is empty.");
        if (!session) return alert("ログインしてください。");

        // 1. Supabaseのデータベースに一応保存する（エラーが出ても次に進む）
        await sb.from('contacts').insert([{ name: session.user.user_metadata.full_name, message: msg }]);

        // 2. Discordへ直接送信する
        const webhookUrl = 'https://discord.com/api/webhooks/1477218371958472724/WT_O6AVWs4jNa1fGfvVo2AZ8LLd7OK4DEespF54El7MQwEAJk6bXbRk7b3FKiyGBvNa7';
        
        try {
            await fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    content: `📩 **${session.user.user_metadata.full_name}** さんからのお問い合わせ\n\`\`\`${msg}\`\`\``
                })
            });

            // 成功したらアラートを出して、入力欄を空にする
            alert("Sent!");
            document.getElementById('msg-input').value = ""; 
        } catch (error) {
            alert("Discordへの送信に失敗しました。");
            console.error(error);
        }
    }

const bgCanvas = document.getElementById('bg-canvas');
    const ctx = bgCanvas.getContext('2d');
    let width, height, particles = [];
    let activeLines = [];
    let currentLine = null;
    let isMouseDown = false; 
    const mouse = { x: null, y: null };
    const connectionDist = 150;

    function resize() { 
        width = bgCanvas.width = window.innerWidth; 
        height = bgCanvas.height = window.innerHeight; 
    }
    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', (e) => { 
        mouse.x = e.clientX; 
        mouse.y = e.clientY; 
    });

// クリック開始部分を以下に書き換え
    window.addEventListener('mousedown', (e) => {
        // 禁止マーク（ドラッグ動作）を完全に封じる
        if (e.button === 0) { // 左クリックの時だけ
            e.preventDefault(); 
        }

        if (e.clientX < 70) return; 
        isMouseDown = true;
        currentLine = { 
            start: { x: e.clientX, y: e.clientY }, 
            end: { x: e.clientX, y: e.clientY }, 
            opacity: 0.6, 
            isFixed: false 
        };
        activeLines.push(currentLine);
    });

    window.addEventListener('mouseup', () => {
        isMouseDown = false;
        if (currentLine) {
            currentLine.isFixed = true;
            currentLine = null; 
        }
    });

    resize();

    class Particle {
        constructor() { this.init(); }
        init() {
            this.x = Math.random() * width; 
            this.y = Math.random() * height;
            this.size = Math.random() * 2 + 1;
            this.speedX = (Math.random() - 0.5) * 1.0;
            this.speedY = (Math.random() - 0.5) * 1.0;
        }
        update() {
            this.x += this.speedX; this.y += this.speedY;
            if (this.x < 0) this.x = width;
            if (this.x > width) this.x = 0;
            if (this.y < 0) this.y = height;
            if (this.y > height) this.y = 0;
        }
        draw() {
            ctx.fillStyle = 'rgba(0, 168, 255, 0.6)';
            ctx.beginPath(); 
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); 
            ctx.fill();
        }
    }

    for (let i = 0; i < 50; i++) particles.push(new Particle());

    // 背景の細い線を引く専用の関数
    function drawConnection(p1, p2, alphaScale = 1) {
        const dx = p1.x - p2.x;
        const dy = p1.y - p2.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < connectionDist) {
            const opacity = (1.5 - (dist / connectionDist)) * 0.2 * alphaScale;
            ctx.strokeStyle = `rgba(0, 168, 255, ${opacity})`;
            ctx.lineWidth = 1.0;
            ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);

        // 1. パーティクルと背景の網目
        particles.forEach((p, i) => {
            p.update(); 
            p.draw();
            
            // マウスとの接続（背景用の細い線）
            if (mouse.x !== null) drawConnection(mouse, p);
            
            // パーティクル同士の接続
            for (let j = i + 1; j < particles.length; j++) {
                drawConnection(p, particles[j]);
            }
        });

        // 2. クリックして引いた太い線の処理
        activeLines.forEach((line) => {
            if (!line.isFixed && isMouseDown) {
                line.end.x = mouse.x;
                line.end.y = mouse.y;
            } else {
                line.isFixed = true; // 強制的に固定モードへ
                line.opacity -= 0.02; 
            }
            
            if (line.opacity > 0) {
                ctx.strokeStyle = `rgba(0, 168, 255, ${line.opacity})`;
                ctx.lineWidth = 1.0; // 少し太くして存在感を出す
                ctx.lineCap = "round";
                ctx.beginPath(); 
                ctx.moveTo(line.start.x, line.start.y); 
                ctx.lineTo(line.end.x, line.end.y); 
                ctx.stroke();
            }
        });

        activeLines = activeLines.filter(l => l.opacity > 0);
        requestAnimationFrame(animate);
    }
    animate();
</script>

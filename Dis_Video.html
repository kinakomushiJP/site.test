<script>
    // --- 動画の絞り込みと並び替え機能 ---
    
    // アカウントによる絞り込み機能
    function filterVideos(authorId, btnElement) {
        // ボタンの見た目（青い枠）を切り替える
        document.querySelectorAll('.account-btn').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');

        // 動画の表示/非表示を切り替える
        const videos = document.querySelectorAll('.video-card');
        videos.forEach(video => {
            if (authorId === 'all' || video.getAttribute('data-author') === authorId) {
                video.classList.remove('hidden');
            } else {
                video.classList.add('hidden');
            }
        });
    }

// --- オリジナルの並び替え機能 ---
    
    // 1. メニューの開け閉め
    function toggleSortMenu() {
        document.getElementById('sort-wrapper').classList.toggle('open');
    }

    // 2. 項目を選んだ時の処理
    function applySort(sortType, labelText) {
        // 表示されている文字を書き換える
        document.getElementById('sort-label').innerText = labelText;
        // メニューを閉じる
        document.getElementById('sort-wrapper').classList.remove('open');

        // 動画を並び替える処理
        const container = document.getElementById('video-container');
        const videos = Array.from(container.getElementsByClassName('video-card'));

        videos.sort((a, b) => {
            const dateA = new Date(a.getAttribute('data-date'));
            const dateB = new Date(b.getAttribute('data-date'));
            return sortType === 'newest' ? dateB - dateA : dateA - dateB;
        });

        videos.forEach(video => container.appendChild(video));
    }

    // 3. 画面の他の場所をクリックしたらメニューを閉じる機能
    window.addEventListener('click', function(e) {
        const wrapper = document.getElementById('sort-wrapper');
        // クリックした場所がメニューの中じゃなければ閉じる
        if (wrapper && !wrapper.contains(e.target)) {
            wrapper.classList.remove('open');
        }
    });

    // --- 1. Supabase設定 ---

const bgCanvas = document.getElementById('bg-canvas');
    const ctx = bgCanvas.getContext('2d');
    let width, height, particles = [];
    let activeLines = [];
    let currentLine = null;
    let isMouseDown = false; 
    const mouse = { x: null, y: null };
    const connectionDist = 150;

    function resize() { 
        width = bgCanvas.width = window.innerWidth; 
        height = bgCanvas.height = window.innerHeight; 
    }
    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', (e) => { 
        mouse.x = e.clientX; 
        mouse.y = e.clientY; 
    });

// クリック開始部分を以下に書き換え
    window.addEventListener('mousedown', (e) => {
        // ★追加：クリックした場所がボタンやメニューかどうかを判定する
        const tag = e.target.tagName.toLowerCase();
        const isUI = ['button', 'input', 'textarea', 'a'].includes(tag) || e.target.closest('.custom-sort-wrapper');

        // ボタンやメニュー「以外」をクリックした時だけ、禁止マークを防ぐ
        if (e.button === 0 && !isUI) { 
            e.preventDefault(); 
        }

        if (e.clientX < 70) return; 
        isMouseDown = true;
        currentLine = { 
            start: { x: e.clientX, y: e.clientY }, 
            end: { x: e.clientX, y: e.clientY }, 
            opacity: 0.6, 
            isFixed: false 
        };
        activeLines.push(currentLine);
    });

    window.addEventListener('mouseup', () => {
        isMouseDown = false;
        if (currentLine) {
            currentLine.isFixed = true;
            currentLine = null; 
        }
    });

    resize();

    class Particle {
        constructor() { this.init(); }
        init() {
            this.x = Math.random() * width; 
            this.y = Math.random() * height;
            this.size = Math.random() * 2 + 1;
            this.speedX = (Math.random() - 0.5) * 1.0;
            this.speedY = (Math.random() - 0.5) * 1.0;
        }
        update() {
            this.x += this.speedX; this.y += this.speedY;
            if (this.x < 0) this.x = width;
            if (this.x > width) this.x = 0;
            if (this.y < 0) this.y = height;
            if (this.y > height) this.y = 0;
        }
        draw() {
            ctx.fillStyle = 'rgba(0, 168, 255, 0.6)';
            ctx.beginPath(); 
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); 
            ctx.fill();
        }
    }

    for (let i = 0; i < 50; i++) particles.push(new Particle());

    // 背景の細い線を引く専用の関数
    function drawConnection(p1, p2, alphaScale = 1) {
        const dx = p1.x - p2.x;
        const dy = p1.y - p2.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < connectionDist) {
            const opacity = (1.5 - (dist / connectionDist)) * 0.2 * alphaScale;
            ctx.strokeStyle = `rgba(0, 168, 255, ${opacity})`;
            ctx.lineWidth = 1.0;
            ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);

        // 1. パーティクルと背景の網目
        particles.forEach((p, i) => {
            p.update(); 
            p.draw();
            
            // マウスとの接続（背景用の細い線）
            if (mouse.x !== null) drawConnection(mouse, p);
            
            // パーティクル同士の接続
            for (let j = i + 1; j < particles.length; j++) {
                drawConnection(p, particles[j]);
            }
        });

        // 2. クリックして引いた太い線の処理
        activeLines.forEach((line) => {
            if (!line.isFixed && isMouseDown) {
                line.end.x = mouse.x;
                line.end.y = mouse.y;
            } else {
                line.isFixed = true; // 強制的に固定モードへ
                line.opacity -= 0.02; 
            }
            
            if (line.opacity > 0) {
                ctx.strokeStyle = `rgba(0, 168, 255, ${line.opacity})`;
                ctx.lineWidth = 1.0; // 少し太くして存在感を出す
                ctx.lineCap = "round";
                ctx.beginPath(); 
                ctx.moveTo(line.start.x, line.start.y); 
                ctx.lineTo(line.end.x, line.end.y); 
                ctx.stroke();
            }
        });

        activeLines = activeLines.filter(l => l.opacity > 0);
        requestAnimationFrame(animate);
    }
    animate();
</script>
